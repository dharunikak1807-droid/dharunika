<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireSphere — Forgot Password & Recovery</title>
    <meta name="description" content="Reset your HireSphere account password.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div id="hs-navbar"></div>

    <div class="hs-auth-wrapper">
        <div class="hs-auth-card">
            
            <div class="hs-auth-header">
                <div class="hs-brand-badge">
                    <div class="hs-logo-icon me-1"><i class="bi bi-shield-lock-fill" style="font-size:1.1rem;"></i></div>
                    <span>HireSphere Security</span>
                </div>
                <h2>Reset Password</h2>
                <p>Enter your registered email address to receive password recovery instructions</p>
            </div>

            <form id="forgot-form" onsubmit="handleForgotPassword(event)" novalidate>
                <div class="mb-4">
                    <label for="forgot-email" class="form-label hs-form-label">Email Address</label>
                    <div class="input-group hs-input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="forgot-email"
                               placeholder="john.doe@gmail.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-hs-primary-green w-100 mb-3" id="forgot-btn">
                    <i class="bi bi-send me-1"></i> Send Recovery Link
                </button>
            </form>

            <div id="simulated-email-notice" class="alert alert-success d-none mt-3">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span id="notice-msg"></span>
            </div>

            <div class="text-center mt-3" style="font-size:0.9rem;">
                <a href="login.html" class="fw-bold text-primary"><i class="bi bi-arrow-left me-1"></i>Back to Sign In</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar();
        });

        async function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();

            if (!email || !validateEmail(email)) {
                showToast('Please enter a valid email address.', 'error');
                return;
            }

            const btn = document.getElementById('forgot-btn');
            setBtnLoading(btn, true);

            const res = await Auth.forgotPassword(email);
            setBtnLoading(btn, false);

            if (res.ok) {
                showToast(res.data.message || 'Recovery email sent.', 'success');
                const notice = document.getElementById('simulated-email-notice');
                const noticeMsg = document.getElementById('notice-msg');
                noticeMsg.textContent = res.data.message + ' (Check backend terminal logs for simulated reset token link)';
                notice.classList.remove('d-none');
            } else {
                showToast(res.error || 'Failed to request password reset.', 'error');
            }
        }
    </script>
</body>
</html>
