<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs — Hirespere</title>
    <meta name="description" content="Browse and search all available jobs on Hirespere. Find opportunities that match your experience and skills.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div id="hs-navbar"></div>

    <header class="hs-page-header">
        <div class="container">
            <h1>Browse Opportunities</h1>
            <p>Discover open positions and take the next step in your career path.</p>
        </div>
    </header>

    <main class="container">
        <!-- Search bar -->
        <div class="hs-search-bar">
            <form id="jobs-search-form" onsubmit="handleSearchSubmit(event)">
                <div class="row g-3">
                    <div class="col-md-9 col-sm-8">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control form-control-lg" id="search-keyword"
                                   placeholder="Search by job title, skills, or location...">
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-4 d-grid">
                        <button type="submit" class="btn btn-primary hs-btn-primary py-2 btn-lg">
                            Search Jobs
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Search Status / Filters indicator -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted fw-semibold" id="results-count-label">Loading jobs...</span>
            <button id="clear-search-btn" class="btn btn-link btn-sm d-none" onclick="clearSearch()">
                <i class="bi bi-x-circle me-1"></i> Clear Search
            </button>
        </div>

        <!-- Jobs Grid -->
        <div class="row g-4" id="jobs-grid-container">
            <!-- Dynamic listings go here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="hs-footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 <strong>Hirespere</strong>. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar();

            /* Parse query params */
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('search');

            if (searchQuery) {
                document.getElementById('search-keyword').value = searchQuery;
                performSearch(searchQuery);
            } else {
                loadAllJobs();
            }
        });

        async function loadAllJobs() {
            showLoader();
            const res = await API.get('/api/jobs');
            hideLoader();

            if (!res.ok) {
                showToast(res.error || 'Failed to load jobs', 'error');
                document.getElementById('jobs-grid-container').innerHTML = emptyState(
                    'exclamation-triangle', 'Error loading jobs', 'There was an issue fetching results from the database.'
                );
                document.getElementById('results-count-label').textContent = 'Error loading listings';
                return;
            }

            renderJobsList(res.data);
            document.getElementById('results-count-label').textContent = `Showing all ${res.data.length} jobs`;
        }

        async function performSearch(keyword) {
            showLoader();
            document.getElementById('clear-search-btn').classList.remove('d-none');
            const res = await API.get(`/api/jobs/search?keyword=${encodeURIComponent(keyword)}`);
            hideLoader();

            if (!res.ok) {
                showToast(res.error || 'Search request failed', 'error');
                document.getElementById('jobs-grid-container').innerHTML = emptyState(
                    'exclamation-triangle', 'Search failed', 'Check your connection or try again.'
                );
                document.getElementById('results-count-label').textContent = 'Search failed';
                return;
            }

            renderJobsList(res.data);
            document.getElementById('results-count-label').textContent = `Found ${res.data.length} jobs matching "${keyword}"`;
        }

        function renderJobsList(jobs) {
            const container = document.getElementById('jobs-grid-container');

            if (!jobs || jobs.length === 0) {
                container.innerHTML = emptyState(
                    'search', 'No jobs found', 'Try refining your keywords or checking back later.'
                );
                return;
            }

            container.innerHTML = jobs.reverse().map(job => `
                <div class="col-md-6 col-lg-4">
                    <div class="hs-card h-100 d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="hs-card-title">${escapeHtml(job.title)}</h5>
                            <div class="hs-card-meta">
                                <span><i class="bi bi-building"></i>${escapeHtml(job.employerName || 'Unknown')}</span>
                                <span><i class="bi bi-geo-alt"></i>${escapeHtml(job.location || 'Remote')}</span>
                            </div>
                            <div class="hs-card-meta">
                                <span><i class="bi bi-currency-rupee"></i>${formatSalary(job.salary)}</span>
                                <span><i class="bi bi-clock"></i>${job.experienceRequired != null ? job.experienceRequired + ' yrs exp' : 'Any exp'}</span>
                            </div>
                            <div class="mb-3">${renderSkillTags(job.requiredSkills)}</div>
                            <p class="text-muted small mb-3">${truncate(job.description, 130)}</p>
                        </div>
                        <div class="pt-2 border-top d-flex justify-content-between align-items-center mt-3">
                            <span class="text-muted small">
                                <i class="bi bi-people me-1"></i>${job.applicationsCount || 0} applications
                            </span>
                            <a href="job-detail.html?id=${job.id}" class="hs-btn-primary btn btn-sm">
                                View Details <i class="bi bi-arrow-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleSearchSubmit(e) {
            e.preventDefault();
            const keyword = document.getElementById('search-keyword').value.trim();
            if (keyword) {
                /* Update query param without full page reload, or perform inline search */
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?search=' + encodeURIComponent(keyword);
                window.history.pushState({ path: newUrl }, '', newUrl);
                performSearch(keyword);
            } else {
                clearSearch();
            }
        }

        function clearSearch() {
            document.getElementById('search-keyword').value = '';
            document.getElementById('clear-search-btn').classList.add('d-none');
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({ path: cleanUrl }, '', cleanUrl);
            loadAllJobs();
        }
    </script>
</body>
</html>
