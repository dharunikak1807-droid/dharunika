<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireSphere — Enterprise Secure Login</title>
    <meta name="description" content="Sign in to your HireSphere Hiring Management account.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div id="hs-navbar"></div>

    <div class="hs-auth-wrapper">
        <div class="hs-auth-card">
            
            <div class="hs-auth-header">
                <div class="hs-brand-badge">
                    <div class="hs-logo-icon me-1"><i class="bi bi-shield-check" style="font-size:1.1rem;"></i></div>
                    <span>HireSphere Security</span>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to your HireSphere account to continue</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" novalidate>
                <div class="mb-3">
                    <label for="login-email" class="form-label hs-form-label">
                        <i class="bi bi-envelope me-1 text-primary"></i>Email Address
                    </label>
                    <div class="input-group hs-input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-circle"></i>
                        </span>
                        <input type="email" class="form-control" id="login-email"
                               placeholder="e.g. recruiter@hiresphere.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="login-password" class="form-label hs-form-label mb-0">
                            <i class="bi bi-lock me-1 text-primary"></i>Password
                        </label>
                        <a href="forgot-password.html" class="text-primary small fw-semibold">Forgot Password?</a>
                    </div>
                    <div class="input-group hs-input-group">
                        <span class="input-group-text">
                            <i class="bi bi-key"></i>
                        </span>
                        <input type="password" class="form-control border-end-0"
                               id="login-password" placeholder="Enter your password"
                               autocomplete="current-password" required>
                        <button type="button" class="input-group-text bg-white border-start-0 text-muted"
                                id="toggle-password" title="Toggle password visibility">
                            <i class="bi bi-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember-me" checked>
                        <label class="form-check-label small text-muted" for="remember-me">
                            Remember me on this device
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn hs-btn-primary w-100 mb-3" id="login-btn">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In Securely
                </button>

                <!-- Quick Demo Accounts -->
                <div class="hs-demo-section text-center">
                    <div class="small fw-bold text-dark mb-2">
                        <i class="bi bi-person-badge-fill me-1 text-primary"></i>Demo Accounts:
                    </div>
                    <div class="d-flex gap-2 justify-content-center flex-wrap">
                        <button type="button" class="btn hs-demo-btn"
                            onclick="fillCreds('hr@technova.com','hiresphere')">
                            <i class="bi bi-building me-1"></i> Employer
                        </button>
                        <button type="button" class="btn hs-demo-btn"
                            onclick="fillCreds('dharunika.k@gmail.com','18072007')">
                            <i class="bi bi-person-workspace me-1"></i> Job Seeker
                        </button>
                    </div>
                    <div class="mt-2 d-flex justify-content-center">
                        <button type="button" class="btn hs-demo-btn-admin"
                            onclick="fillCreds('dharunika@hiresphere.com','dharunika2007')">
                            <i class="bi bi-shield-lock-fill me-1"></i> Admin Portal
                        </button>
                    </div>
                </div>
            </form>

            <div class="text-center mt-4" style="font-size:0.9rem;">
                <span class="text-muted">Don't have an account?</span>
                <a href="register.html" class="fw-bold text-primary ms-1">Create an Account</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar();
            if (Auth.isLoggedIn()) {
                window.location.href = Auth.getDashboardUrl();
            }

            document.getElementById('toggle-password').addEventListener('click', function () {
                const pwdInput = document.getElementById('login-password');
                const eyeIcon  = document.getElementById('eye-icon');
                if (pwdInput.type === 'password') {
                    pwdInput.type = 'text';
                    eyeIcon.className = 'bi bi-eye-slash text-primary';
                } else {
                    pwdInput.type = 'password';
                    eyeIcon.className = 'bi bi-eye';
                }
            });
        });

        function fillCreds(email, password) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = password;
        }

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;

            if (!email) {
                showToast('Please enter your email address.', 'error');
                return;
            }
            if (!password) {
                showToast('Please enter your password.', 'error');
                return;
            }

            const btn = document.getElementById('login-btn');
            setBtnLoading(btn, true);

            const res = await Auth.login(email, password, rememberMe);
            setBtnLoading(btn, false);

            if (res.ok) {
                showToast('Authentication successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = Auth.getDashboardUrl();
                }, 800);
            } else {
                showToast(res.error || 'Invalid email or password.', 'error');
            }
        }
    </script>
</body>
</html>
