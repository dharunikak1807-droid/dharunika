<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — HireSphere</title>
    <meta name="description" content="Sign in to your HireSphere account to manage jobs, applications, and your profile.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div id="hs-navbar"></div>

    <div class="hs-auth-bg">
        <div class="hs-auth-glass">
            <div class="hs-auth-logo">
                <i class="bi bi-person-fill-lock"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="hs-auth-subtitle">Sign in to your HireSphere account</p>

            <form id="login-form" onsubmit="handleLogin(event)" novalidate>
                <div class="mb-3">
                    <label for="login-username" class="form-label">
                        <i class="bi bi-person me-1 text-primary"></i>Username
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" id="login-username"
                               placeholder="Enter your username" autocomplete="username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="login-password" class="form-label">
                        <i class="bi bi-lock me-1 text-primary"></i>Password
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0"
                               id="login-password" placeholder="Enter your password"
                               autocomplete="current-password" required>
                        <button type="button" class="input-group-text bg-light border-start-0 hs-pass-toggle"
                                id="toggle-password" title="Show/hide password">
                            <i class="bi bi-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn hs-btn-primary w-100 py-2 mb-3" id="login-btn">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>

                <!-- Quick-fill demo credentials -->
                <div class="text-center mb-3">
                    <small class="text-muted">Quick Demo:</small><br>
                    <div class="d-flex gap-1 justify-content-center flex-wrap mt-1">
                        <button type="button" class="btn btn-sm btn-outline-danger"
                            onclick="fillCreds('admin','admin123')">
                            <i class="bi bi-shield-check me-1"></i>Admin
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-success"
                            onclick="fillCreds('tcs_recruiter','employer123')">
                            <i class="bi bi-building me-1"></i>Employer
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary"
                            onclick="fillCreds('priya.sharma','seeker123')">
                            <i class="bi bi-person-workspace me-1"></i>Seeker
                        </button>
                    </div>
                </div>
            </form>

            <p class="text-center mb-0" style="font-size:0.9rem;">
                Don't have an account?
                <a href="register.html" class="fw-semibold">Create one free</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar();
            if (Auth.isLoggedIn()) {
                window.location.href = Auth.getDashboardUrl();
            }

            // Password visibility toggle
            document.getElementById('toggle-password').addEventListener('click', function () {
                const pwdInput = document.getElementById('login-password');
                const eyeIcon  = document.getElementById('eye-icon');
                if (pwdInput.type === 'password') {
                    pwdInput.type = 'text';
                    eyeIcon.className = 'bi bi-eye-slash';
                } else {
                    pwdInput.type = 'password';
                    eyeIcon.className = 'bi bi-eye';
                }
            });
        });

        function fillCreds(username, password) {
            document.getElementById('login-username').value = username;
            document.getElementById('login-password').value = password;
        }

        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!validateRequired([
                { id: 'login-username', name: 'Username' },
                { id: 'login-password', name: 'Password' }
            ])) return;

            const btn = document.getElementById('login-btn');
            setBtnLoading(btn, true);

            const res = await Auth.login(username, password);
            setBtnLoading(btn, false);

            if (res.ok) {
                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = Auth.getDashboardUrl();
                }, 800);
            } else {
                showToast(res.error || 'Invalid username or password', 'error');
            }
        }
    </script>
</body>
</html>
