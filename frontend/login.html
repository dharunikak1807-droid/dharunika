<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Hirespere</title>
    <meta name="description" content="Login to your Hirespere account to manage jobs, applications, and your profile.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div id="hs-navbar"></div>

    <div class="hs-auth-wrapper">
        <div class="hs-auth-card">
            <div class="text-center mb-3">
                <i class="bi bi-globe2" style="font-size:2.5rem; color:var(--hs-primary);"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="hs-auth-subtitle">Sign in to your Hirespere account</p>

            <form id="login-form" onsubmit="handleLogin(event)" novalidate>
                <div class="mb-3">
                    <label for="login-username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="login-username"
                               placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="login-password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="login-password"
                               placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn hs-btn-primary w-100 py-2" id="login-btn">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <p class="text-center mt-3 mb-0" style="font-size:0.9rem;">
                Don't have an account?
                <a href="register.html" class="fw-semibold">Create one</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar();
            /* If already logged in, redirect to dashboard */
            if (Auth.isLoggedIn()) {
                window.location.href = Auth.getDashboardUrl();
            }
        });

        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!validateRequired([
                { id: 'login-username', name: 'Username' },
                { id: 'login-password', name: 'Password' }
            ])) return;

            const btn = document.getElementById('login-btn');
            setBtnLoading(btn, true);

            const res = await Auth.login(username, password);

            setBtnLoading(btn, false);

            if (res.ok) {
                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = Auth.getDashboardUrl();
                }, 800);
            } else {
                showToast(res.error || 'Invalid username or password', 'error');
            }
        }
    </script>
</body>
</html>
