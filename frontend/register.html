<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireSphere — Create Account</title>
    <meta name="description" content="Create a new HireSphere account. Register as a Job Seeker or Recruiter / Employer.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div id="hs-navbar"></div>

    <div class="hs-auth-wrapper">
        <div class="hs-auth-card wide">
            
            <div class="hs-auth-header">
                <div class="hs-brand-badge">
                    <div class="hs-logo-icon me-1"><i class="bi bi-person-plus-fill" style="font-size:1.1rem;"></i></div>
                    <span>HireSphere Enterprise</span>
                </div>
                <h2>Create Account</h2>
                <p>Join HireSphere to connect with top talent or find your next career opportunity</p>
            </div>

            <!-- Role Selector Tabs -->
            <div class="row g-2 mb-4">
                <div class="col-6">
                    <div class="hs-role-tab active" id="tab-seeker" onclick="switchRoleTab('JOB_SEEKER')">
                        <i class="bi bi-person-workspace me-2"></i>Job Seeker
                    </div>
                </div>
                <div class="col-6">
                    <div class="hs-role-tab" id="tab-recruiter" onclick="switchRoleTab('EMPLOYER')">
                        <i class="bi bi-building me-2"></i>Recruiter / Employer
                    </div>
                </div>
            </div>

            <form id="register-form" onsubmit="handleRegister(event)" novalidate>
                <input type="hidden" id="reg-role" value="JOB_SEEKER">

                <!-- ════════════════ JOB SEEKER FIELDS ════════════════ -->
                <div id="section-job-seeker" class="row g-3">
                    <div class="col-md-6">
                        <label for="seeker-firstName" class="form-label hs-form-label">First Name *</label>
                        <input type="text" class="form-control" id="seeker-firstName" placeholder="John" required>
                    </div>
                    <div class="col-md-6">
                        <label for="seeker-lastName" class="form-label hs-form-label">Last Name *</label>
                        <input type="text" class="form-control" id="seeker-lastName" placeholder="Doe" required>
                    </div>
                    <div class="col-md-6">
                        <label for="seeker-email" class="form-label hs-form-label">Email Address *</label>
                        <input type="email" class="form-control" id="seeker-email" placeholder="john.doe@gmail.com" autocomplete="email" required>
                    </div>
                    <div class="col-md-6">
                        <label for="seeker-phone" class="form-label hs-form-label">Mobile Number *</label>
                        <input type="tel" class="form-control" id="seeker-phone" placeholder="+91 9876543210" required>
                    </div>

                    <div class="col-md-6">
                        <label for="seeker-password" class="form-label hs-form-label">Password *</label>
                        <input type="password" class="form-control" id="seeker-password" placeholder="At least 8 characters" autocomplete="new-password" required>
                    </div>
                    <div class="col-md-6">
                        <label for="seeker-confirmPwd" class="form-label hs-form-label">Confirm Password *</label>
                        <input type="password" class="form-control" id="seeker-confirmPwd" placeholder="Re-enter password" autocomplete="new-password" required>
                    </div>

                    <div class="col-md-6">
                        <label for="seeker-gender" class="form-label hs-form-label">Gender</label>
                        <select class="form-select" id="seeker-gender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="seeker-dob" class="form-label hs-form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="seeker-dob">
                    </div>

                    <div class="col-md-12">
                        <label for="seeker-address" class="form-label hs-form-label">Address</label>
                        <input type="text" class="form-control" id="seeker-address" placeholder="City, State, Country">
                    </div>

                    <div class="col-md-6">
                        <label for="seeker-education" class="form-label hs-form-label">Education / Degree</label>
                        <input type="text" class="form-control" id="seeker-education" placeholder="B.Tech Computer Science">
                    </div>
                    <div class="col-md-6">
                        <label for="seeker-experience" class="form-label hs-form-label">Total Experience</label>
                        <select class="form-select" id="seeker-experience">
                            <option value="Fresher">Fresher (0 Years)</option>
                            <option value="1-2 Years">1-2 Years</option>
                            <option value="3-5 Years">3-5 Years</option>
                            <option value="5+ Years">5+ Years</option>
                        </select>
                    </div>

                    <div class="col-md-12">
                        <label for="seeker-skills" class="form-label hs-form-label">Skills (Comma separated) *</label>
                        <input type="text" class="form-control" id="seeker-skills" placeholder="Java, Spring Boot, MySQL, REST APIs" required>
                    </div>

                    <div class="col-md-12">
                        <label for="seeker-resume" class="form-label hs-form-label">Resume URL / Upload Link</label>
                        <input type="url" class="form-control" id="seeker-resume" placeholder="https://drive.google.com/your-resume-cv.pdf">
                    </div>
                </div>

                <!-- ════════════════ RECRUITER FIELDS ════════════════ -->
                <div id="section-recruiter" class="row g-3 d-none">
                    <div class="col-md-6">
                        <label for="rec-companyName" class="form-label hs-form-label">Company Name *</label>
                        <input type="text" class="form-control" id="rec-companyName" placeholder="TechNova Solutions">
                    </div>
                    <div class="col-md-6">
                        <label for="rec-fullName" class="form-label hs-form-label">Recruiter Name *</label>
                        <input type="text" class="form-control" id="rec-fullName" placeholder="Sarah Jenkins">
                    </div>

                    <div class="col-md-6">
                        <label for="rec-email" class="form-label hs-form-label">Corporate Email Address *</label>
                        <input type="email" class="form-control" id="rec-email" placeholder="recruiter@technova.com" autocomplete="email">
                    </div>
                    <div class="col-md-6">
                        <label for="rec-phone" class="form-label hs-form-label">Mobile Number *</label>
                        <input type="tel" class="form-control" id="rec-phone" placeholder="+91 9876543210">
                    </div>

                    <div class="col-md-6">
                        <label for="rec-password" class="form-label hs-form-label">Password *</label>
                        <input type="password" class="form-control" id="rec-password" placeholder="At least 8 characters" autocomplete="new-password">
                    </div>
                    <div class="col-md-6">
                        <label for="rec-confirmPwd" class="form-label hs-form-label">Confirm Password *</label>
                        <input type="password" class="form-control" id="rec-confirmPwd" placeholder="Re-enter password" autocomplete="new-password">
                    </div>

                    <div class="col-md-6">
                        <label for="rec-website" class="form-label hs-form-label">Company Website</label>
                        <input type="url" class="form-control" id="rec-website" placeholder="https://technova.com">
                    </div>
                    <div class="col-md-6">
                        <label for="rec-address" class="form-label hs-form-label">Company Address</label>
                        <input type="text" class="form-control" id="rec-address" placeholder="Bangalore, Karnataka">
                    </div>
                </div>

                <button type="submit" class="btn btn-hs-primary-green w-100 mt-4 py-2" id="register-btn">
                    <i class="bi bi-check-circle me-1"></i> Complete Registration
                </button>
            </form>

            <div class="text-center mt-3" style="font-size:0.9rem;">
                <span class="text-muted">Already registered?</span>
                <a href="login.html" class="fw-bold text-primary ms-1">Sign In</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar();
            if (Auth.isLoggedIn()) {
                window.location.href = Auth.getDashboardUrl();
            }
        });

        function switchRoleTab(role) {
            document.getElementById('reg-role').value = role;

            const tabSeeker = document.getElementById('tab-seeker');
            const tabRecruiter = document.getElementById('tab-recruiter');
            const secSeeker = document.getElementById('section-job-seeker');
            const secRecruiter = document.getElementById('section-recruiter');

            if (role === 'JOB_SEEKER') {
                tabSeeker.classList.add('active');
                tabRecruiter.classList.remove('active');
                secSeeker.classList.remove('d-none');
                secRecruiter.classList.add('d-none');
            } else {
                tabRecruiter.classList.add('active');
                tabSeeker.classList.remove('active');
                secRecruiter.classList.remove('d-none');
                secSeeker.classList.add('d-none');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();

            const role = document.getElementById('reg-role').value;
            let payload = {};

            if (role === 'JOB_SEEKER') {
                const firstName = document.getElementById('seeker-firstName').value.trim();
                const lastName  = document.getElementById('seeker-lastName').value.trim();
                const email     = document.getElementById('seeker-email').value.trim();
                const phone     = document.getElementById('seeker-phone').value.trim();
                const password  = document.getElementById('seeker-password').value.trim();
                const confirmPwd= document.getElementById('seeker-confirmPwd').value.trim();
                const gender    = document.getElementById('seeker-gender').value;
                const dob       = document.getElementById('seeker-dob').value;
                const address   = document.getElementById('seeker-address').value.trim();
                const education = document.getElementById('seeker-education').value.trim();
                const exp       = document.getElementById('seeker-experience').value;
                const skills    = document.getElementById('seeker-skills').value.trim();
                const resume    = document.getElementById('seeker-resume').value.trim();

                if (!firstName || !lastName || !email || !phone || !password || !skills) {
                    showToast('Please fill in all required fields.', 'error');
                    return;
                }

                if (!validateEmail(email)) {
                    showToast('Please enter a valid email address.', 'error');
                    return;
                }

                if (password.length < 8) {
                    showToast('Password must be at least 8 characters.', 'error');
                    return;
                }

                if (password !== confirmPwd) {
                    showToast('Passwords do not match.', 'error');
                    return;
                }

                payload = {
                    firstName,
                    lastName,
                    email,
                    phone,
                    password,
                    confirmPassword: confirmPwd,
                    role: 'JOB_SEEKER',
                    username: email,
                    address,
                    companyName: ''
                };
            } else {
                const companyName = document.getElementById('rec-companyName').value.trim();
                const fullName    = document.getElementById('rec-fullName').value.trim();
                const email       = document.getElementById('rec-email').value.trim();
                const phone       = document.getElementById('rec-phone').value.trim();
                const password    = document.getElementById('rec-password').value.trim();
                const confirmPwd  = document.getElementById('rec-confirmPwd').value.trim();
                const website     = document.getElementById('rec-website').value.trim();
                const address     = document.getElementById('rec-address').value.trim();

                if (!companyName || !fullName || !email || !phone || !password) {
                    showToast('Please fill in all required recruiter fields.', 'error');
                    return;
                }

                if (!validateEmail(email)) {
                    showToast('Please enter a valid corporate email.', 'error');
                    return;
                }

                if (password.length < 8) {
                    showToast('Password must be at least 8 characters.', 'error');
                    return;
                }

                if (password !== confirmPwd) {
                    showToast('Passwords do not match.', 'error');
                    return;
                }

                const names = fullName.split(' ');
                payload = {
                    firstName: names[0] || fullName,
                    lastName: names.slice(1).join(' ') || '',
                    fullName,
                    email,
                    phone,
                    password,
                    confirmPassword: confirmPwd,
                    role: 'EMPLOYER',
                    username: email,
                    companyName,
                    address
                };
            }

            const btn = document.getElementById('register-btn');
            setBtnLoading(btn, true);

            const res = await Auth.register(payload);
            setBtnLoading(btn, false);

            if (res.ok) {
                showToast('Registration successful! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            } else {
                showToast(res.error || 'Registration failed. Please try again.', 'error');
            }
        }
    </script>
</body>
</html>
