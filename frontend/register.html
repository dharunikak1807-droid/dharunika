<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Hirespere</title>
    <meta name="description" content="Create a new Hirespere account. Register as a Job Seeker or Employer.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div id="hs-navbar"></div>

    <div class="hs-auth-wrapper">
        <div class="hs-auth-card" style="max-width: 520px;">
            <div class="text-center mb-3">
                <i class="bi bi-person-plus-fill" style="font-size:2.5rem; color:var(--hs-primary);"></i>
            </div>
            <h2>Create Account</h2>
            <p class="hs-auth-subtitle">Join Hirespere and take your next career step</p>

            <form id="register-form" onsubmit="handleRegister(event)" novalidate>
                <div class="mb-3">
                    <label for="reg-fullName" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" class="form-control" id="reg-fullName"
                               placeholder="John Doe" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="reg-username" class="form-label">Username (Email/Identifier)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="reg-username"
                               placeholder="johndoe123" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="reg-password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="reg-password"
                               placeholder="Choose a strong password" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="reg-role" class="form-label">I want to register as a</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-gear"></i></span>
                        <select class="form-select" id="reg-role" onchange="toggleEmployerFields()" required>
                            <option value="JOB_SEEKER">Job Seeker</option>
                            <option value="EMPLOYER">Employer</option>
                        </select>
                    </div>
                </div>

                <!-- Employer specific fields -->
                <div class="mb-4 d-none" id="employer-fields">
                    <label for="reg-companyName" class="form-label">Company Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-building"></i></span>
                        <input type="text" class="form-control" id="reg-companyName"
                               placeholder="Acme Corporation">
                    </div>
                </div>

                <button type="submit" class="btn hs-btn-primary w-100 py-2" id="register-btn">
                    <i class="bi bi-check-circle me-1"></i> Register Account
                </button>
            </form>

            <p class="text-center mt-3 mb-0" style="font-size:0.9rem;">
                Already have an account?
                <a href="login.html" class="fw-semibold">Sign in</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar();
            if (Auth.isLoggedIn()) {
                window.location.href = Auth.getDashboardUrl();
            }
        });

        function toggleEmployerFields() {
            const role = document.getElementById('reg-role').value;
            const companyFields = document.getElementById('employer-fields');
            if (role === 'EMPLOYER') {
                companyFields.classList.remove('d-none');
            } else {
                companyFields.classList.add('d-none');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();

            const fullName = document.getElementById('reg-fullName').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const role = document.getElementById('reg-role').value;
            const companyName = document.getElementById('reg-companyName').value.trim();

            const fieldsToValidate = [
                { id: 'reg-fullName', name: 'Full Name' },
                { id: 'reg-username', name: 'Username' },
                { id: 'reg-password', name: 'Password' }
            ];

            if (role === 'EMPLOYER') {
                fieldsToValidate.push({ id: 'reg-companyName', name: 'Company Name' });
            }

            if (!validateRequired(fieldsToValidate)) return;

            const btn = document.getElementById('register-btn');
            setBtnLoading(btn, true);

            const payload = {
                username,
                password,
                fullName,
                role,
                companyName: role === 'EMPLOYER' ? companyName : ''
            };

            const res = await Auth.register(payload);
            setBtnLoading(btn, false);

            if (res.ok) {
                showToast('Registration successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = Auth.getDashboardUrl();
                }, 800);
            } else {
                showToast(res.error || 'Registration failed', 'error');
            }
        }
    </script>
</body>
</html>
