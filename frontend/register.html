<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — HireSphere</title>
    <meta name="description" content="Create a new HireSphere account. Register as a Job Seeker or Employer.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div id="hs-navbar"></div>

    <div class="hs-auth-bg">
        <div class="hs-auth-glass" style="max-width:520px;">
            <div class="hs-auth-logo">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h2>Create Account</h2>
            <p class="hs-auth-subtitle">Join HireSphere and take your next career step</p>

            <form id="register-form" onsubmit="handleRegister(event)" novalidate>
                <div class="mb-3">
                    <label for="reg-fullName" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person-badge text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" id="reg-fullName"
                               placeholder="Priya Sharma" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="reg-username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-at text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" id="reg-username"
                               placeholder="priya.sharma" autocomplete="username" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="reg-password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0"
                               id="reg-password" placeholder="Choose a strong password"
                               autocomplete="new-password" oninput="checkStrength(this.value)" required>
                        <button type="button" class="input-group-text bg-light border-start-0 hs-pass-toggle"
                                id="toggle-reg-password">
                            <i class="bi bi-eye" id="reg-eye-icon"></i>
                        </button>
                    </div>
                    <div class="hs-strength-bar mt-1">
                        <div class="hs-strength-fill" id="strength-fill"></div>
                    </div>
                    <small id="strength-label" class="text-muted"></small>
                </div>

                <div class="mb-3">
                    <label for="reg-role" class="form-label">I want to register as</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person-gear text-muted"></i>
                        </span>
                        <select class="form-select border-start-0" id="reg-role"
                                onchange="toggleEmployerFields()" required>
                            <option value="JOB_SEEKER">
                                Job Seeker — Find my dream job
                            </option>
                            <option value="EMPLOYER">
                                Employer — Hire top talent
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Employer-only field -->
                <div class="mb-4 d-none" id="employer-fields">
                    <label for="reg-companyName" class="form-label">Company Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-building text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0"
                               id="reg-companyName" placeholder="Acme Corporation">
                    </div>
                </div>

                <button type="submit" class="btn hs-btn-primary w-100 py-2" id="register-btn">
                    <i class="bi bi-check-circle me-1"></i> Create Account
                </button>
            </form>

            <p class="text-center mt-3 mb-0" style="font-size:0.9rem;">
                Already have an account?
                <a href="login.html" class="fw-semibold">Sign in</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar();
            if (Auth.isLoggedIn()) {
                window.location.href = Auth.getDashboardUrl();
            }

            document.getElementById('toggle-reg-password').addEventListener('click', function () {
                const pwd = document.getElementById('reg-password');
                const icon = document.getElementById('reg-eye-icon');
                if (pwd.type === 'password') {
                    pwd.type = 'text';
                    icon.className = 'bi bi-eye-slash';
                } else {
                    pwd.type = 'password';
                    icon.className = 'bi bi-eye';
                }
            });
        });

        function checkStrength(value) {
            const fill  = document.getElementById('strength-fill');
            const label = document.getElementById('strength-label');
            let strength = 0;
            if (value.length >= 6)  strength++;
            if (value.length >= 10) strength++;
            if (/[A-Z]/.test(value)) strength++;
            if (/[0-9]/.test(value)) strength++;
            if (/[^A-Za-z0-9]/.test(value)) strength++;

            const levels = [
                { w: '0%',   c: '',          l: '' },
                { w: '25%',  c: '#e53e3e',   l: '⚠ Weak' },
                { w: '50%',  c: '#f0a500',   l: '~ Fair' },
                { w: '75%',  c: '#3a86ff',   l: '✓ Good' },
                { w: '100%', c: '#2cb67d',   l: '✓ Strong' },
            ];
            const s = Math.min(strength, 4);
            fill.style.width = levels[s].w;
            fill.style.background = levels[s].c;
            label.textContent = levels[s].l;
            label.style.color = levels[s].c;
        }

        function toggleEmployerFields() {
            const role = document.getElementById('reg-role').value;
            const companyFields = document.getElementById('employer-fields');
            companyFields.classList.toggle('d-none', role !== 'EMPLOYER');
        }

        async function handleRegister(e) {
            e.preventDefault();

            const fullName   = document.getElementById('reg-fullName').value.trim();
            const username   = document.getElementById('reg-username').value.trim();
            const password   = document.getElementById('reg-password').value.trim();
            const role       = document.getElementById('reg-role').value;
            const companyName = document.getElementById('reg-companyName').value.trim();

            const fieldsToValidate = [
                { id: 'reg-fullName', name: 'Full Name' },
                { id: 'reg-username', name: 'Username' },
                { id: 'reg-password', name: 'Password' }
            ];

            if (role === 'EMPLOYER') {
                fieldsToValidate.push({ id: 'reg-companyName', name: 'Company Name' });
            }

            if (!validateRequired(fieldsToValidate)) return;

            if (password.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                return;
            }

            const btn = document.getElementById('register-btn');
            setBtnLoading(btn, true);

            const payload = {
                username,
                password,
                fullName,
                role,
                companyName: role === 'EMPLOYER' ? companyName : ''
            };

            const res = await Auth.register(payload);
            setBtnLoading(btn, false);

            if (res.ok) {
                showToast('Account created successfully! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = Auth.getDashboardUrl();
                }, 800);
            } else {
                showToast(res.error || 'Registration failed. Please try again.', 'error');
            }
        }
    </script>
</body>
</html>
