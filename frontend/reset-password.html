<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireSphere — Set New Password</title>
    <meta name="description" content="Set a new password for your HireSphere account.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div id="hs-navbar"></div>

    <div class="hs-auth-wrapper">
        <div class="hs-auth-card">
            
            <div class="hs-auth-header">
                <div class="hs-brand-badge">
                    <div class="hs-logo-icon me-1"><i class="bi bi-key-fill" style="font-size:1.1rem;"></i></div>
                    <span>HireSphere Security</span>
                </div>
                <h2>Set New Password</h2>
                <p>Choose a strong password for your account</p>
            </div>

            <form id="reset-form" onsubmit="handleResetPassword(event)" novalidate>
                <div class="mb-3">
                    <label for="reset-token" class="form-label hs-form-label">Reset Token</label>
                    <div class="input-group hs-input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="text" class="form-control" id="reset-token" placeholder="Paste reset token here" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="reset-password" class="form-label hs-form-label">New Password</label>
                    <div class="input-group hs-input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="reset-password"
                               placeholder="At least 8 characters" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-hs-primary-green w-100 mb-3" id="reset-btn">
                    <i class="bi bi-check2-circle me-1"></i> Update Password
                </button>
            </form>

            <div class="text-center mt-3" style="font-size:0.9rem;">
                <a href="login.html" class="fw-bold text-primary"><i class="bi bi-arrow-left me-1"></i>Back to Sign In</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar();
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (token) {
                document.getElementById('reset-token').value = token;
            }
        });

        async function handleResetPassword(e) {
            e.preventDefault();
            const token = document.getElementById('reset-token').value.trim();
            const newPassword = document.getElementById('reset-password').value.trim();

            if (!token) {
                showToast('Reset token is required.', 'error');
                return;
            }

            if (newPassword.length < 8) {
                showToast('Password must be at least 8 characters.', 'error');
                return;
            }

            const btn = document.getElementById('reset-btn');
            setBtnLoading(btn, true);

            const res = await Auth.resetPassword(token, newPassword);
            setBtnLoading(btn, false);

            if (res.ok) {
                showToast(res.data.message || 'Password updated successfully! Redirecting...', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } else {
                showToast(res.error || 'Failed to reset password.', 'error');
            }
        }
    </script>
</body>
</html>
